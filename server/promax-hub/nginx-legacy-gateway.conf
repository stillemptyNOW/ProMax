limit_req_zone $binary_remote_addr zone=promax_hub:10m rate=5r/s;

server {
    listen 80;
    server_name boriskino.qd.je;
    location /.well-known/acme-challenge/ { root /var/www/promax-push; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 127.0.0.1:4443 ssl http2 proxy_protocol;
    server_name boriskino.qd.je;
    ssl_certificate /etc/letsencrypt/live/boriskino.qd.je/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/boriskino.qd.je/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;
    client_max_body_size 48k;
    access_log off;
    error_log /var/log/nginx/promax-hub.error.log warn;
    proxy_ssl_server_name on;
    proxy_ssl_name proma-x.xyz;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 3;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_set_header Host proma-x.xyz;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 20s;

    location = / {
        proxy_pass https://2.26.230.233/notifications/;
    }
    location ~ ^/(index\.html|app\.js|sw\.js|push-core\.js|styles\.css|manifest\.webmanifest|open\.html|open\.js|icons/[A-Za-z0-9._-]+\.png)$ {
        proxy_pass https://2.26.230.233/notifications$request_uri;
    }
    location / {
        limit_req zone=promax_hub burst=20 nodelay;
        proxy_pass https://2.26.230.233;
    }
}
