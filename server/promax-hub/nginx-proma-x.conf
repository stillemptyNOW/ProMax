server {
    listen 80;
    listen [::]:80;
    server_name proma-x.xyz www.proma-x.xyz;
    location /.well-known/acme-challenge/ { root /var/www/proma-x; }
    location / { return 301 https://proma-x.xyz$request_uri; }
}

server {
    listen 127.0.0.1:4443 ssl http2 proxy_protocol;
    server_name proma-x.xyz;
    ssl_certificate /etc/letsencrypt/live/proma-x.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/proma-x.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;
    client_max_body_size 48k;
    access_log off;
    error_log /var/log/nginx/proma-x.error.log warn;
    gzip on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;
    location /site/ {
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 20s;
    }
    location / {
        limit_req zone=promax_hub burst=20 nodelay;
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 20s;
    }
}
