publish_to: none
environment:
  sdk: ^3.10.4
dependencies:
  flutter:
    sdk: flutter
  flutter_webrtc: 1.5.2
flutter:
  plugin:
    platforms:
      ios:
        pluginClass: ProMaxEffectsPlugin
