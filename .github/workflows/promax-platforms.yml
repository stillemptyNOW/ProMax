name: ProMax Android & Desktop

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to create on this commit and publish to, e.g. v1.1.0+113-beta.5
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: promax-platforms-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.0'
  RELEASE_TAG: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: ./.github/actions/setup-rust
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - name: Dependencies
        run: flutter pub get
      - name: Release signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No release keystore in secrets: the APKs are signed with the debug key and are not published."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/promax-release.jks
          {
            echo "storeFile=promax-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          } > android/key.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - name: Build APKs
        run: |
          flutter build apk --release --split-per-abi --flavor promax \
            --obfuscate --split-debug-info=build/symbols
          flutter build apk --release --flavor promax \
            --obfuscate --split-debug-info=build/symbols
      - name: Collect APKs
        run: |
          version=$(awk '/^version:/ {split($2, v, "+"); print v[1]; exit}' pubspec.yaml)
          mkdir -p dist
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "build/app/outputs/flutter-apk/app-$abi-promax-release.apk" \
              "dist/ProMax-$version-promax-$abi.apk"
          done
          cp build/app/outputs/flutter-apk/app-promax-release.apk \
            "dist/ProMax-$version-promax-universal.apk"
          ls -la dist
      - name: Publish release
        if: env.RELEASE_TAG != '' && steps.signing.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/publish-release.sh "$RELEASE_TAG" dist/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ProMax-android
          path: dist/*.apk
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: ProMax-android-symbols
          path: build/symbols
          retention-days: 30

  windows:
    runs-on: windows-latest
    timeout-minutes: 75
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: ./.github/actions/setup-rust
        with:
          targets: x86_64-pc-windows-msvc
      - name: Dependencies
        run: flutter pub get
      - name: Build
        run: flutter build windows --release
      - name: Bundle the Visual C++ runtime
        shell: pwsh
        run: |
          $bundle = 'build/windows/x64/runner/Release'
          foreach ($dll in 'msvcp140.dll', 'msvcp140_1.dll', 'msvcp140_2.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            $source = Join-Path $env:WINDIR "System32\$dll"
            if (Test-Path $source) { Copy-Item $source $bundle -Force }
          }
          foreach ($required in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            if (-not (Test-Path (Join-Path $bundle $required))) { throw "$required is missing from the bundle" }
          }
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath dist/ProMax-windows-x64.zip
      - name: Installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          if (-not (Test-Path $iscc)) { throw 'Inno Setup was not installed' }
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*(\S+)').Matches[0].Groups[1].Value
          $name, $build = $version.Split('+')
          & $iscc "/DAppVersion=$name" "/DAppBuild=$build" windows/installer/promax.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE" }
          Get-ChildItem dist
      - name: Publish release
        if: env.RELEASE_TAG != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/publish-release.sh "$RELEASE_TAG" dist/ProMax-windows-x64.zip dist/ProMax-Setup-*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: ProMax-windows-x64
          path: |
            dist/ProMax-windows-x64.zip
            dist/ProMax-Setup-*.exe
          retention-days: 14

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake ninja-build \
            pkg-config libgtk-3-dev libsecret-1-dev libmpv-dev liblzma-dev \
            libopus-dev libogg-dev libpulse-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: ./.github/actions/setup-rust
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Dependencies
        run: flutter pub get
      - name: Build
        run: flutter build linux --release --verbose
      - name: Package
        run: |
          mkdir -p dist
          tar -C build/linux/x64/release/bundle -czf dist/ProMax-linux-x64.tar.gz .
      - name: Publish release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/publish-release.sh "$RELEASE_TAG" dist/ProMax-linux-x64.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: ProMax-linux-x64
          path: dist/ProMax-linux-x64.tar.gz
          retention-days: 14
