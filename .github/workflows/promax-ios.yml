name: ProMax iOS

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to create on this commit and publish to, e.g. v1.1.0+113-beta.5
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: promax-ios-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.0'
  RELEASE_TAG: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Verify encryption core
        run: make -C native/promax_crypto test shared
      - name: Verify voice processing
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined native/promax_effects/test/voice_processor_test.cpp -o /tmp/promax-voice-test
          /tmp/promax-voice-test
      - name: Dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze lib test tool native/promax_effects/lib
      - name: Test
        env:
          PROMAX_CRYPTO_TEST_LIB: ${{ github.workspace }}/native/promax_crypto/build/libpromax_crypto.so
        run: flutter test
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify ProMax Tools
        run: node --experimental-vm-modules test/promax_toolbox_test.mjs
      - name: Verify ProMax Web Push
        run: node --experimental-vm-modules test/promax_web_push_test.mjs
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify push relay
        working-directory: server/apns-relay
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -v

  ios:
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: ./.github/actions/setup-rust
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - name: Dependencies
        run: flutter pub get
      - uses: ./.github/actions/pin-kolibri-crates
      - name: Build iPhone app
        run: |
          flutter config --no-enable-swift-package-manager
          flutter build ios --release --no-codesign
      - name: Package IPA for eSign
        run: |
          mkdir -p build/ios/Payload dist
          cp -R build/ios/iphoneos/Runner.app build/ios/Payload/
          cd build/ios
          zip -qr ../../dist/ProMax-ios-unsigned.ipa Payload
      - name: Package ProMax Tools
        run: |
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('dist/ProMax-Tools.pmx', 'w', compression=zipfile.ZIP_DEFLATED) as package:
              for name in ('manifest.json', 'main.js'):
                  package.write('assets/plugins/promax/' + name, name)
          PY
      - name: Publish release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .github/scripts/publish-release.sh "$RELEASE_TAG" \
            dist/ProMax-ios-unsigned.ipa \
            dist/ProMax-Tools.pmx
      - uses: actions/upload-artifact@v4
        with:
          name: ProMax-ios-unsigned
          path: |
            dist/ProMax-ios-unsigned.ipa
            dist/ProMax-Tools.pmx
          retention-days: 14
