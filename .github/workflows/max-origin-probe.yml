name: MAX origin probe

on:
  push:
    branches: ['claude/**']
    paths: ['.github/probe/**', '.github/workflows/max-origin-probe.yml']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: pip install websockets msgpack
      - run: python .github/probe/max_origin_probe.py
